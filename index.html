<meta property="og:type" content="website">

<!-- After hosting, replace the line below with your full address, e.g. https://yoursite.netlify.app/emblem.png -->
<meta property="og:image" content="https://farakhani.github.io/ndc-voting/emblem.png">
<style>
  :root{--green:#006B3F;--red:#CE1126;--black:#111;--ink:#1c2a22;--muted:#5b6b62;--line:#dbe5df}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--green);color:var(--ink);
    min-height:100vh;min-height:100dvh;
    display:flex;justify-content:center;align-items:flex-start;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  }
  .card{width:100%;max-width:440px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .stripe{height:8px;background:linear-gradient(90deg,var(--red) 0 33.3%,#fff 33.3% 66.6%,var(--black) 66.6%)}
  header{text-align:center;padding:16px 20px 12px}
  .emb{position:relative;display:block;border-radius:50%;box-shadow:0 5px 12px rgba(0,0,0,.3)}
  .emb img{display:block;width:100%;height:100%;border-radius:50%;filter:brightness(1.1) saturate(1.5) contrast(1.1)}
  .emb::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 45% 22% at 30% 11%,rgba(255,255,255,.55),transparent 80%),linear-gradient(155deg,rgba(255,255,255,.16),transparent 40%,rgba(0,0,0,.12))}
  header .emb{width:96px;height:96px;margin:0 auto 10px}
  h1{font-size:1.45rem;line-height:1.2;margin:0 0 4px;color:var(--green);letter-spacing:.2px}
  .sub{margin:0;color:var(--muted);font-size:.98rem}
  .produced{
    background:var(--black);color:#fff;text-align:center;
    padding:12px 16px;border-top:3px solid var(--red);border-bottom:3px solid var(--green);
  }
  .produced small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#cfd8d2}
  .produced strong{display:block;font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  main{padding:16px 20px 20px}
  .venue{background:#f3f8f5;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .venue b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
  .venue span{font-size:1.02rem;line-height:1.4}
  label{display:block;font-weight:800;color:var(--red);font-size:1.05rem;margin-bottom:8px}
  input{
    width:100%;font-size:1.05rem;padding:15px 14px;border:2px solid var(--line);border-radius:12px;
    background:#fff;color:var(--ink);appearance:none;
  }
  input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,107,63,.18)}
  .hint{margin:6px 0 14px;font-size:.88rem;color:var(--muted)}
  button{
    width:100%;display:flex;align-items:center;gap:14px;
    background:var(--green);color:#fff;border:0;border-radius:16px;
    padding:10px 20px 10px 10px;min-height:76px;cursor:pointer;
    font:inherit;font-size:1.2rem;font-weight:700;text-align:left;
    box-shadow:0 6px 14px rgba(0,107,63,.35);
  }
  button:active{transform:translateY(1px);filter:brightness(.94)}
  button .emb{width:56px;height:56px;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
  button span{display:block;line-height:1.15}
  button em{display:inline-block;font-style:normal;font-weight:800;font-size:.7rem;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--red);background:#fff;padding:3px 9px;border-radius:999px;margin-top:6px}
  button .go{margin-left:auto;font-size:1.6rem}
  .sr{position:absolute;left:-9999px}
</style>
</head>

  var DESTINATION = "Ark Burlington Danes Academy, Du Cane Road, White City, London W12 0TN";
